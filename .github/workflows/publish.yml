name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1, which the npm bundled with Node LTS is not guaranteed to be.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install
        working-directory: ./packages/mikro-orm-attachments

      - name: Generate changelog and bump version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          bunx standard-version --release-as ${{ inputs.version }}
        working-directory: ./packages/mikro-orm-attachments

      - name: Build package
        run: bun run build
        working-directory: ./packages/mikro-orm-attachments

      - name: Copy README.md and CHANGELOG.md
        run: bun run copy:readme
        working-directory: ./packages/mikro-orm-attachments

      # Authenticates via OIDC against the trusted publisher configured on npmjs.com
      # (package settings -> Trusted Publisher -> GitHub Actions, repo + `publish.yml`).
      # No NPM_TOKEN involved, and provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --access public
        working-directory: ./packages/mikro-orm-attachments

      - name: Push changes and tags
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git push --follow-tags
